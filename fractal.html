<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>рекурсия</title>
    <link rel="stylesheet" href="dizine.css">
    <script src="taping.js" defer></script>
</head>
<body>
    <a href="index.html" class="back ftp">обратно</a>
    <div>
        <h3 class="ftp">
            мой фрактал
        </h3>
        <div>
            <div>
                <div class="no_line vftp">глубина</div>
                <input type="range" min="1" max="20" value="1" id="tree_input">
            </div>
            <canvas width="800px" height="400px" id="tree_paint"></canvas>
        </div>
    </div>
    <script>
        const canvas = document.getElementById("tree_paint");
        const pero = canvas.getContext('2d');
        const inpu = document.getElementById("tree_input");
        inpu.addEventListener("input",() =>{
            pero.clearRect(0,0,1100,1100)

            let b = Number(inpu.value);
            let a1 = 400;
            let a2 = 400;
            let c = 0
            let d = 0

            for (let i = 0; i < b; i++) {


                pero.strokeStyle = "#00ff00";
                pero.lineWidth = 5;

                pero.beginPath();
                pero.moveTo(400-d,a1);
                a1 = a1-10;
                pero.lineTo(400-c,a1);

                pero.stroke();

                pero.beginPath();
                pero.moveTo(400+d,a2);
                a2 = a2-10;
                pero.lineTo(400+c,a2);

                pero.stroke();

                d=c
                c = c+(i+1)*2;
            }
        })

        let b = Number(inpu.value);
        let a = 400;

        pero.strokeStyle = "#00ff00";
        pero.lineWidth = 5;

        pero.beginPath();
        pero.moveTo(400,a);
        a = a-10;
        pero.lineTo(400,a);

        pero.stroke();
    </script>
</body>
</html>
