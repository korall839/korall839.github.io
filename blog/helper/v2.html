<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>helper v2</title>
    <style>
        ul {
            list-style: none;
            padding: 0;
        }
        main {
            background-color: rgb(20, 10, 30);
            border-radius: 30px;
            border: 1px solid;
            border-color: rgb(25, 45, 50);
        }
        body {
            background-color: rgb(10, 0, 15);
            color: #7777ff;
            text-align: center;
        }
        p {
            color: #b8b8b8;
        }
        a {
            color: blueviolet;
            &.back {
                display: block;
                text-align: left;
            }
        }
        div {
            border: 3px solid;
            border-radius: 30px;
            border-color: rgb(0, 200, 255);
            &.no_line {
                border-color: rgba(0, 0, 0, 0);
            }
            &.line {
                border-color: rgba(0, 0, 0, 0);
                display: flex;
            }
            &.prodgect {
                flex: 1;
                border: 1px solid;
                border-color: rgb(0, 200, 255);
            }
            &.mn {
                border: 1px solid;
                border-color: rgb(0, 200, 255);
            }
            &.me {
                border: 2px solid;
                border-color: rgb(0, 200, 255);
            }
        }   
    </style>
</head>
<body>
    <a href="../packer.html" class="back">обратно</a>

        на данный момент не вышедшие в опенсорс обновление кода. что в нём нового?
    </h4>
    <main>
        <ul>
            <li>
                1. восроизведение звука.
            </li>
            <li>

            </li>
        </ul>
    </main>
</body>
</html>
