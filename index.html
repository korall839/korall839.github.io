<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>не Document</title>
    <style>
        body {
            background-color: rgb(0, 0, 0);
            color: #3171a5;
            text-align: center;
            padding-top: 100px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin-bottom: 5px;
        }
        button {
            background-color: rgb(36, 64, 83);
            color: #8241cc; 
        }
        button:hover {
            background-color: #294126;
            color: #6c35aa;
        }
        table {
            margin: auto;
            border: #42dfe4;
        }
        input[type="checkbox"] {
            appearance: none;
            width: 15px;
            height: 15px;
            vertical-align: middle;
            background-color: black;
            border: 2px solid #42d1e4;
        }
        input[type="checkbox"]:checked {
            background-color: #00ffdd;
        }
        @keyframes fall {
            from {transform: translateY(-500px)};
            to {transform: translateY(20vh)};
        }
        .my_element {
            position: fixed;
            color: #FFFFFF;
            pointer-events: none;
            animation: fall 4s linear;
        }
    </style>
</head>
<body>
    <h2>
        С наступаюшей зимой
    </h2>
    <ul>
        <li>
            <label>
                <input type="checkbox" id="robot"> i'm not a robot
            </label>
        </li>
        <li>
            <br>
            <button onclick="if (document.getElementById('robot').checked) {alert('ты взломан'); window.location.href='hack.html'}">просто кнопка</button>
        </li>
    </ul>
    <table border="1">
        <tr>
            <th>
                товар
            </th>
            <th>
                цена
            </th>
            <th>
                скидка
            </th>
            <th>
                количество
            </th>
        </tr>
        <tr>
            <th>
                воздух
            </th>
            <th>
                99999999999 евро
            </th>
            <th>
                100%
            </th>
            <th>
                ∞
            </th>
            <th>
                <button onclick="alert('успешно')">
                    заплатить
                </button>
            </th>
        </tr>
        <tr>
            <th>
                палка
            </th>
            <th>
                3 изумруда
            </th>
            <th>
                50%
            </th>
            <th>
                ∞
            </th>
            <th>
                <button onclick="alert('успешно')">
                    заплатить
                </button>
            </th>
        </tr>
    </table>
    <script>
        setInterval(() => {
            const s = document.createElement("div");
            s.className = "my_element"
            s.innerText = "❄"
            s.style.left= Math.random() * 1000 + "px";
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 30000)
        }, 250);
    </script>
</body>
</html>
